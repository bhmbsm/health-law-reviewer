name: Vercel production health check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user >/dev/null

      - name: Verify production site
        run: |
          set -euo pipefail
          status_code=$(curl --location --silent --show-error --output /dev/null \
            --write-out "%{http_code}" --max-time 30 \
            https://health-law-reviewer.vercel.app)
          test "$status_code" = "200"
